<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온담이 날씨 위치</title>
<!-- 온담이 ☀️ 카드의 [📍 지금 있는 곳 날씨] 버튼이 여는 페이지 (온담이 v2 4단계 Task 10).
     열리면 위치를 읽어 대화방에 위치 메시지 하나로 보내고 바로 닫는다. 위치는 이 페이지가 저장하지 않는다.
     LIFF SDK 는 v2.31.1 이상 (v2.20.0~v2.31.0 보안 문제로 폐기 — LINE 공지 2026-09-30) -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.31.1/sdk.js"></script>
<style>
  body { font-family: system-ui, "Noto Sans KR", sans-serif; margin: 0; padding: 24px 16px; background: #F5F7F6; color: #18242A; font-size: 22px; line-height: 1.6; text-align: center; }
  #state { font-size: 28px; font-weight: 700; margin: 40px 0 24px; word-break: keep-all; }
  button { font-size: 26px; font-weight: 700; padding: 20px; width: 100%; border: 0; border-radius: 12px; background: #2E86C1; color: #fff; }
</style>
</head>
<body>
<div id="state">📍 지금 계신 곳을 확인하고 있어요</div>
<button id="retry" hidden>다시</button>
<script>
// 에이전트는 이 제목인 위치만 날씨용으로 받는다 (agent/weather/tool.py WEATHER_LOC_TITLE) — 글자 그대로
const TITLE = '📍 지금 계신 곳';
// LIFF ID 는 주소의 ?id= 로도 받는다 (공개 값)
const LIFF_ID = new URLSearchParams(location.search).get('id') || '2011939135-ZDRvnniq';
const stateEl = document.getElementById('state');
const retryEl = document.getElementById('retry');

function fail(text) {
  stateEl.textContent = text;
  retryEl.hidden = false;
}

function readLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('no_geolocation'));
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 20000, maximumAge: 600000 });
  });
}

async function run() {
  retryEl.hidden = true;
  stateEl.textContent = '📍 지금 계신 곳을 확인하고 있어요';
  let pos;
  try {
    pos = await readLocation();
  } catch (e) {
    return fail('위치를 못 읽었어요. 다시 눌러 주세요');
  }
  const lat = pos && pos.coords && pos.coords.latitude;
  const lng = pos && pos.coords && pos.coords.longitude;
  if (typeof lat !== 'number' || typeof lng !== 'number') {  // 좌표가 없으면 보내지 않는다
    return fail('위치를 못 읽었어요. 다시 눌러 주세요');
  }
  try {
    await liff.sendMessages([{ type: 'location', title: TITLE, address: '날씨 확인', latitude: lat, longitude: lng }]);
  } catch (e) {
    return fail('보내지 못했어요. 다시 눌러 주세요');
  }
  liff.closeWindow();
}

retryEl.onclick = () => location.reload();  // 처음부터 다시 (LIFF 준비 실패 때도)

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    return fail('지금은 열 수 없어요. 다시 눌러 주세요');
  }
  if (!liff.isInClient()) {
    stateEl.textContent = 'LINE 대화방에서 [📍] 버튼을 눌러 주세요';
    return;
  }
  await run();
})();
</script>
</body>
</html>
